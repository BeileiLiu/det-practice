<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦉 DET 模拟练习 · 19 题型</title>
<style>
  :root{
    --accent:#00a3ff; --accent-dark:#0078c8; --bg:#f5f7fa; --card:#ffffff;
    --text:#1c1e21; --muted:#5f6b76; --border:#e3e8ee; --green:#1aab5a; --red:#e5484d;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:8px}
  h1{font-size:22px;margin:0}
  .header-actions{display:flex;gap:8px}
  button{font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:var(--accent-dark)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:var(--accent-dark);color:#fff}
  button.ai{background:#fff7e6;border-color:#ffd591;color:#d46b08}
  button.ai:hover{border-color:#ffa940;color:#ad4e00}
  button.ghost{background:#f0f4f8;border-color:#d6dee6;color:var(--muted)}
  button.small{font-size:12px;padding:5px 9px}
  button:disabled{opacity:.5;cursor:not-allowed}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
  nav button{font-size:13px;padding:7px 11px}
  nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
  .q-type{font-weight:600;font-size:15px}
  .q-sub{font-size:11px;color:var(--muted);font-weight:400}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent-dark);background:#eaf5ff;padding:4px 10px;border-radius:20px;font-size:15px}
  .timer.warn{color:var(--red);background:#fdecec}
  .q-instr{color:var(--muted);font-size:14px;margin:6px 0 14px}
  .word-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .word{padding:14px;font-size:16px;border-radius:10px;background:#f9fbfd;min-height:48px}
  .word.selected{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .q-actions{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap}
  textarea{width:100%;min-height:110px;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:10px;font-family:inherit;resize:vertical}
  .passage{font-size:16px;line-height:2.2;background:#f9fbfd;border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
  .fib-input{font-size:15px;width:11ch;padding:2px 6px;border-radius:6px;border:1px solid var(--accent);background:#fff;margin:0 2px}
  .fib-input.ok{background:#eafaf0;border-color:var(--green)}
  .fib-input.bad{background:#fdecec;border-color:var(--red)}
  .fibw-item{margin-bottom:16px;font-size:16px;line-height:2.1}
  .passage-scroll{max-height:240px;overflow:auto;font-size:16px;line-height:2.0;background:#f9fbfd;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px}
  .photo-card{margin:10px 0 14px;padding:30px 18px;text-align:center;border-radius:12px;color:#fff;
    background:linear-gradient(135deg,#4facfe 0%,#00f2fe 100%);font-size:15px;line-height:1.7}
  .photo-img{width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin:8px 0 14px;display:block}
  .sentence{font-size:19px;text-align:center;padding:20px;background:#f0f7ff;border-radius:12px;margin-bottom:14px;line-height:1.6}
  .prompt-box{font-size:15px;line-height:1.8;background:#f0f7ff;border-radius:12px;padding:16px;margin-bottom:14px}
  .ir-q{margin:0 0 14px}
  .ir-q .qt{font-size:12px;color:var(--accent-dark);font-weight:700}
  .ir-q p{margin:4px 0 6px;line-height:1.6}
  .opts{display:flex;flex-direction:column;gap:6px}
  .opt{display:flex;gap:8px;align-items:flex-start;background:#f9fbfd;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.5;cursor:pointer}
  .opt:hover{border-color:var(--accent)}
  .opt input{margin-top:3px}
  .chat{display:flex;flex-direction:column;gap:8px;margin:12px 0}
  .chat .bub{max-width:80%;padding:9px 13px;border-radius:12px;font-size:15px;line-height:1.6}
  .chat .bub.a{background:#eaf5ff;align-self:flex-start;border-bottom-left-radius:3px}
  .chat .bub.b{background:#eef1f4;align-self:flex-end;border-bottom-right-radius:3px}
  .captured{margin-top:10px;color:var(--muted);font-size:14px;min-height:20px;line-height:1.6}
  .result{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:16px}
  .result h3{margin:0 0 12px;font-size:16px}
  .score-line{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .big-score{font-size:34px;font-weight:800;color:var(--accent-dark)}
  .dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
  .dim{background:#f6f9fc;border-radius:8px;padding:10px;text-align:center}
  .dim b{display:block;font-size:20px}
  .dim span{color:var(--muted);font-size:12px}
  .comment{font-size:14px;line-height:1.7;color:var(--text)}
  .comment .priority{margin-top:8px;color:var(--accent-dark);font-weight:600}
  .part-tag{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:2px 8px;margin-right:6px}
  footer{margin-top:28px;color:var(--muted);font-size:12px;line-height:1.8}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal{background:#fff;border-radius:14px;padding:22px;width:min(520px,92vw);max-height:86vh;overflow:auto}
  .modal h2{margin:0 0 14px;font-size:17px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;font-size:14px;padding:9px 11px;border:1px solid var(--border);border-radius:8px}
  .hidden{display:none}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .history-item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
  .history-item:last-child{border-bottom:none}
  .ok{color:var(--green);font-weight:600}
  .err{color:var(--red);font-weight:600}
  /* ===== 模拟考试模式 ===== */
  #testBar{display:flex;align-items:center;gap:10px;background:#eaf5ff;border:1px solid var(--accent);border-radius:10px;padding:8px 14px;margin-bottom:8px;font-size:14px;color:var(--accent-dark)}
  #testBar button{margin-left:auto}
  body.testing #typeTabs, body.testing .header-actions{display:none}
  .test-mode #aiBtn, .test-mode #startBtn, .test-mode .timer{display:none}
  .test-mode .q-actions{justify-content:flex-end}
  .test-mode .card{box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .report-table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
  .report-table th,.report-table td{border-bottom:1px solid var(--border);padding:7px 8px;text-align:left}
  .report-table th{color:var(--muted);font-weight:600;font-size:12px}
  .report-table td.c{text-align:right;font-weight:700;color:var(--accent-dark)}
  .toolbar{display:flex;align-items:center;gap:10px;margin:6px 0 0;font-size:13px;color:var(--muted)}
  .toolbar select{font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:8px}
  .band{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--accent-dark);border-radius:10px;padding:2px 8px;margin-left:4px;vertical-align:middle}
  body.testing .toolbar{display:none}
  /* ===== 互动阅读 IR（Duolingo 绿主题）===== */
  .ir-green .primary{background:#58CC02;border-color:#58CC02;color:#fff}
  .ir-green .primary:hover{background:#46A302;color:#fff}
  .ir-progress{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12px;color:var(--muted)}
  .ir-track{flex:1;height:8px;background:#eef1f4;border-radius:10px;overflow:hidden}
  .ir-track .ir-bar{height:100%;background:#58CC02;border-radius:10px;transition:width .3s}
  .ir-passage p{margin:6px 0;line-height:1.9}
  .ir-passage mark{background:#ffe58f;padding:0 2px;border-radius:3px}
  .ir-passage select.ir-blank{font-size:14px;padding:2px 6px;border-radius:6px;border:1px solid var(--border);background:#fff}
  .ir-passage select.ir-blank.ir-ok{background:#d9f7be;border-color:#52c41a}
  .ir-passage select.ir-blank.ir-bad{background:#ffccc7;border-color:#ff4d4f}
  .ir-sblank{display:inline-block;min-width:150px;border-bottom:2px dashed #bbb;color:#999}
  .ir-opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;font-size:14px;line-height:1.5;border-radius:10px;background:#fff;border:1px solid var(--border)}
  .ir-opt:hover{border-color:#58CC02}
  .ir-opt.ir-correct{background:#d9f7be;border-color:#52c41a;color:#237804;font-weight:600}
  .ir-opt.ir-wrong{background:#ffccc7;border-color:#ff4d4f;color:#a8071a}
  .ir-fb{min-height:20px;margin-top:8px;font-size:13px;font-weight:600;color:var(--muted)}
  .ir-passage{user-select:text;-webkit-user-select:text}
  .ir-pool{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .ir-chip{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:grab;font-size:14px;line-height:1.3}
  .ir-chip:hover{border-color:#58CC02}
  .ir-chip.sel{border-color:#58CC02;background:#d9f7be}
  .ir-chip.used{opacity:.35;cursor:default;background:#f0f2f5}
  .ir-chip-s{font-size:13px;text-align:left;max-width:100%}
  .ir-dropzone{display:inline-block;min-width:74px;min-height:24px;border-bottom:2px dashed #bbb;color:#999;padding:0 6px;text-align:center;vertical-align:middle;cursor:pointer;transition:.15s}
  .ir-dz-s{min-width:200px;min-height:26px;line-height:1.4}
  .ir-dropzone.filled{background:#d9f7be;color:#237804;border-bottom:2px solid #52c41a;font-weight:600}
  .ir-dropzone.bad{background:#ffccc7;border-bottom-color:#ff4d4f}
  .ir-dropzone.ok{background:#d9f7be}
  .opt.il-ok{background:#d9f7be;border-color:#52c41a;color:#237804}
  .opt.il-bad{background:#ffccc7;border-color:#ff4d4f;color:#a8071a}
  .il-fb{min-height:20px;margin-top:8px;font-size:13px;font-weight:600;color:var(--accent-dark)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🦉 DET 模拟练习</h1>
    <div class="header-actions">
      <button id="btnRandom">🎲 随机一题</button>
      <button id="btnTest" class="primary">🧪 模拟考试</button>
      <button id="btnSettings">⚙ 设置</button>
      <button id="btnHistory">📜 记录</button>
    </div>
  </header>
  <div id="testBar" class="hidden">🧪 模拟考试 · <span id="testPhase"></span> <button id="btnQuitTest">退出考试</button></div>
  <nav id="typeTabs"></nav>
  <div class="toolbar">
    <label for="bandSel">照片分数段</label>
    <select id="bandSel">
      <option value="all">全部</option>
      <option value="60">60–85 · B1</option>
      <option value="90">90–115 · B2</option>
      <option value="120">120–160 · C1/C2</option>
    </select>
    <span>（仅对看图写作 / 看图说话生效，对应题目上会标分数段）</span>
  </div>
  <main>
    <div id="questionArea"></div>
    <div id="resultArea"></div>
  </main>
  <footer>
    按 2026 版 DET 19 大题型编排（含互动阅读 5 子题、互动听力 3 子题）。客观题当场自检，主观题由 DeepSeek 实时批改。<br>
    API Key 只存浏览器 localStorage。「🔄 AI 出题」现场生成新题，无限量。<br>
    口语/听力需要 Chrome/Edge + 麦克风权限 + 系统英文语音（浏览器 TTS 模拟，辨音仅供参考）。想调难度或补题型，回聊天说一声。
  </footer>
</div>

<div id="settingsModal" class="modal-bg hidden">
  <div class="modal">
    <h2>⚙ API 设置</h2>
    <div class="field"><label>API Key</label><input id="setKey" type="password" placeholder="sk-..."></div>
    <div class="field"><label>模型</label><input id="setModel" placeholder="deepseek-chat"></div>
    <div class="field"><label>接口地址</label><input id="setEndpoint" placeholder="https://api.deepseek.com/chat/completions"></div>
    <div class="field"><label>目标分（可选）</label><input id="setGoal" placeholder="例如 125"></div>
    <div class="field"><label>弱项（可选）</label><input id="setWeak" placeholder="例如：听力、时态"></div>
    <div class="q-actions">
      <button id="testBtn">🔌 测试连接</button>
      <button id="saveBtn" class="primary">保存</button>
      <button id="closeSettings">关闭</button>
    </div>
    <p id="testResult" class="hint"></p>
  </div>
</div>

<div id="historyModal" class="modal-bg hidden">
  <div class="modal">
    <h2>📜 练习记录</h2>
    <div id="historyList"></div>
    <div class="q-actions" style="margin-top:12px"><button id="closeHistory">关闭</button></div>
  </div>
</div>

<script>
"use strict";
// ================= 设置 =================
const SETTINGS_KEY='detSettings', HISTORY_KEY='detHistory';
const DEFAULT_SETTINGS={apiKey:'',model:'deepseek-chat',endpoint:'https://api.deepseek.com/chat/completions',goal:'',weak:''};
let settings=Object.assign({},DEFAULT_SETTINGS,JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}'));
function saveSettings(){localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));}

// ================= 题型配置（2026 DET 19 题型）=================
const TC={
  rs:{label:'词汇判断',sub:'Read & Select',time:30},
  fib:{label:'完形打字',sub:'Read & Complete',time:180},
  fibw:{label:'选词填空',sub:'Fill in the Blanks',time:180},
  lt:{label:'听写',sub:'Listen & Type',time:60},
  ir:{label:'互动阅读',sub:'Interactive Reading',time:420},
  il:{label:'互动听力',sub:'Interactive Listening',time:480},
  sp:{label:'看图说话',sub:'Speak About the Photo',time:90},
  rtsp:{label:'读后口说',sub:'Read, Then Speak',time:90},
  isp:{label:'互动口说',sub:'Interactive Speaking',time:180},
  ss:{label:'口说样题',sub:'Speaking Sample',time:180},
  wp:{label:'看图写作',sub:'Write About the Photo',time:60},
  iw:{label:'互动写作',sub:'Interactive Writing',time:600},
  ws:{label:'写作样题',sub:'Writing Sample',time:300}
};
const TABORDER=['rs','fib','fibw','lt','ir','il','sp','rtsp','isp','ss','wp','iw','ws'];

// ================= 照片库（按 DET 分数段分档）=================
// band: 60=60-85 B1 / 90=90-115 B2 / 120=120-160 C1-C2
const PHOTOS=[
  {photo:'images/bench.jpg',band:'60',scene:'公园里的一张木质长椅，周围是树木。'},
  {photo:'images/coffee.jpg',band:'60',scene:'桌上放着一杯咖啡。'},
  {photo:'images/park.jpg',band:'60',scene:'公园小路上，一位女士牵着一只狗在散步。'},
  {photo:'images/office.jpg',band:'60',scene:'一间现代会议室，长桌旁摆着椅子。'},
  {photo:'images/library.jpg',band:'90',scene:'一间安静的图书馆，书架上摆满书，中间有几张长桌。'},
  {photo:'images/market.jpg',band:'90',scene:'露天市场的一个果蔬摊位，摊上摆满水果和蔬菜。'},
  {photo:'images/picnic.jpg',band:'90',scene:'公园的野餐区，绿地上有野餐的人和野餐桌。'},
  {photo:'images/cafe.jpg',band:'90',scene:'街边一家咖啡馆，透过窗户能看到外面的街道。'},
  {photo:'images/street.jpg',band:'120',scene:'一条繁忙的城市街道，有很多行人和车辆。'},
  {photo:'images/crowd.jpg',band:'120',scene:'拥挤的购物人群，人们提着袋子在穿行。'},
  {photo:'images/party.jpg',band:'120',scene:'一群朋友围坐在一起，面带笑容，似乎在庆祝什么。'}
];

// ================= 内置题库 =================
const BANK={
  rs:[
    {words:[{w:'weather',real:1},{w:'cleam',real:0},{w:'journey',real:1},{w:'thriend',real:0},{w:'honest',real:1},{w:'spleak',real:0},{w:'breakfast',real:1},{w:'mircle',real:0},{w:'window',real:1}]},
    {words:[{w:'garden',real:1},{w:'cabl',real:0},{w:'courage',real:1},{w:'snurp',real:0},{w:'market',real:1},{w:'blist',real:0},{w:'library',real:1},{w:'grood',real:0},{w:'student',real:1}]}
  ],
  fib:[
    {segments:[
      {text:'Learning a foreign language can be '},{gap:{word:'challenging'}},
      {text:' at first, but it becomes easier with regular '},{gap:{word:'practice'}},
      {text:'. Many experts agree that '},{gap:{word:'immersion'}},
      {text:' is the fastest way to make real progress.'}
    ]},
    {segments:[
      {text:'The doctor told me to drink more water and get enough '},{gap:{word:'sleep'}},
      {text:'. A balanced '},{gap:{word:'diet'}},
      {text:' is also important. Regular exercise helps people stay '},{gap:{word:'healthy'}},
      {text:' and reduces '},{gap:{word:'stress'}},
      {text:'.'}
    ]}
  ],
  fibw:[
    {items:[
      {segments:[{text:'He threw the ball and tried to '},{gap:{word:'catch'}},{text:' it before it hit the ground.'}]},
      {segments:[{text:'The meeting was '},{gap:{word:'cancelled'}},{text:' because the manager was sick.'}]},
      {segments:[{text:'She decided to '},{gap:{word:'apply'}},{text:' for the scholarship at the last minute.'}]}
    ]},
    {items:[
      {segments:[{text:'Regular exercise can '},{gap:{word:'improve'}},{text:' both your health and your mood.'}]},
      {segments:[{text:'Please remember to '},{gap:{word:'confirm'}},{text:' your booking before you arrive.'}]},
      {segments:[{text:'The teacher asked us to '},{gap:{word:'submit'}},{text:' the report by Friday.'}]}
    ]}
  ],
  lt:[
    {sentence:'The library opens early on weekends.'},
    {sentence:'Please send me the report by Friday afternoon.'},
    {sentence:'She studies English every day after work.'},
    {sentence:'They decided to meet at the station at six.'}
  ],
  ir:[
    {type:'叙事',time:480,
     paras:['Maya loved drawing, and she never went anywhere without her sketchbook. One Tuesday morning, she packed her backpack for school and checked that her favorite pen was inside. On the bus, she reached for her sketchbook to draw the passing trees, but it was not there. Her heart sank, because that notebook had all her best drawings from the past year.',
      'She remembered taking it out during lunch the day before, when she showed her friend Leo a picture of a cat. After that, she put it on the table to get more food. Leo told her to wait while he finished his sandwich, but Maya hurried to join a game outside. She realized that she must have left the notebook behind in the cafeteria.',
      'After school, Maya walked straight to the cafeteria and found it closed. A janitor was cleaning the tables and asked her what she had lost. Maya described the notebook, and the janitor smiled. Someone had handed it to the office that morning. When Maya got the notebook back, she promised herself she would always keep it in her backpack, zipped up tight.'],
     q1:{blanks:[
       {p:0,word:'checked',options:['checked','cleaned','measured','pressed'],answer:0},
       {p:0,word:'reached',options:['reached','waited','looked','returned'],answer:0},
       {p:1,word:'remembered',options:['remembered','forgot','imagined','decided'],answer:0},
       {p:2,word:'described',options:['described','explained','mentioned','repeated'],answer:0},
       {p:2,word:'promised',options:['promised','warned','taught','ordered'],answer:0}],
      pool:['checked','reached','remembered','described','promised','opened','looked','ordered']},
     q2:{p:1,sentence:'Leo told her to wait while he finished his sandwich, but Maya hurried to join a game outside.',
      options:['Leo told her to wait while he finished his sandwich, but Maya hurried to join a game outside.','Leo asked her to stay and watch the birds by the window.','They decided to leave together and walk home in the afternoon.','Maya told him about her plan to visit the museum on Saturday.'],answer:0},
     q3:{question:'According to the story, where did Maya think she had left her sketchbook?',answer:'left the notebook behind in the cafeteria'},
     q4:{question:'What did Maya promise herself at the end of the story?',answer:'keep it in her backpack'},
     q5:{question:'What is the main idea of the story?',options:['Maya lost her sketchbook and learned to be more careful with her things.','Maya wanted to draw better pictures of trees and cats.','The school cafeteria closes early every afternoon.','Leo helped Maya find a new sketchbook at the store.'],answer:0},
     q6:{options:['Maya\'s Missing Sketchbook','How to Draw a Cat','A Trip to the Cafeteria','Leo\'s Favorite Sandwich'],answer:0}},

// ================= 工具 =================
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function pad(n){return String(n).padStart(2,'0');}
function fmt(sec){return Math.floor(sec/60)+':'+pad(sec%60);}
function startTimer(sec,onDone){
  clearTimer();timeLeft=sec;
  const el=document.getElementById('timer');
  const tick=()=>{
    if(el){el.textContent=fmt(timeLeft);el.classList.toggle('warn',timeLeft<=10);}
    if(timeLeft<=0){clearInterval(timerId);timerId=null;if(onDone)onDone();return;}
    timeLeft--;
  };
  tick();timerId=setInterval(tick,1000);
}
function clearTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
const lastIdx={};
function nextQuestion(type){
  const bank=(type==='wp'||type==='sp')?photoBankFiltered():BANK[type];
  if(!bank.length)return null;
  if(bank.length<=1){lastIdx[type]=0;return bank[0];}
  let idx;
  do{idx=Math.floor(Math.random()*bank.length);}while(idx===lastIdx[type]);
  lastIdx[type]=idx;return bank[idx];
}
function speak(text,rate){
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=rate||0.9;
  const en=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('en'));
  if(en)u.voice=en;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
function startRecord(finalCb,errCb,continuous){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){errCb('当前浏览器不支持麦克风，请用 Chrome/Edge');return;}
  const rec=new SR();window.__rec=rec;
  rec.lang='en-US';rec.continuous=!!continuous;rec.interimResults=true;rec.maxAlternatives=1;
  let final='';
  rec.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++){if(e.results[i].isFinal)t+=' '+e.results[i][0].transcript;}if(t)final=t.trim();};
  rec.onend=()=>{if(finalCb)finalCb(final);};
  rec.onerror=e=>{errCb('录音失败：'+e.error);};
  rec.start();
}
function stopRecord(){if(window.__rec){try{window.__rec.stop();}catch(e){}}}
function normWords(s){return s.toLowerCase().replace(/[^a-z'\s]/g,' ').split(/\s+/).filter(Boolean);}

// ================= 渲染入口 =================
function setActiveTab(type){document.querySelectorAll('#typeTabs button').forEach(b=>b.classList.toggle('active',b.dataset.key===type));}
function renderCurrent(type,q){clearTimer();resultArea.innerHTML='';RENDERERS[type](q);}
function showType(type){
  currentType=type;clearTimer();resultArea.innerHTML='';
  currentQ=nextQuestion(type);
  setActiveTab(type);
  if(currentQ)RENDERERS[type](currentQ);
}
function cardHead(label,sub,t,badge){
  return `<div class="q-head"><span class="q-type">${label} <span class="q-sub">${sub}</span>${badge||''}</span><span class="timer" id="timer">${fmt(t)}</span></div>`;
}
function aiBtn(){return `<button id="aiBtn" class="ai">🔄 AI 出题</button>`;}
function photoHtml(q){
  if(q.photo)return `<img class="photo-img" src="${esc(q.photo)}" alt="photo">`;
  return `<div class="photo-card">🖼 ${esc(q.scene)}</div>`;
}
const BAND_LABEL={60:'60–85 · B1',90:'90–115 · B2',120:'120–160 · C1/C2'};
function bandLabel(b){return BAND_LABEL[b]||b;}
function bandBadge(q){return q.band?` <span class="band">DET ${bandLabel(q.band)}</span>`:'';}
function photoBankFiltered(){
  let bank=BANK.wp;
  if(bandFilter!=='all'){const f=bank.filter(it=>it.band===bandFilter);if(f.length)bank=f;}
  return bank;
}

// ================= 词汇判断 RS =================
function renderRS(q){
  rsState.idx=0;rsState.ans=[];
  qArea.innerHTML=`<div class="card">${cardHead(TC.rs.label,TC.rs.sub,5)}
    <p class="q-instr">判断下面的词是不是真实存在的英语单词，点「是」或「否」。每词限时 5 秒。</p>
    <div class="sentence" id="rsWord"></div>
    <div class="q-actions">${aiBtn()}<button id="yesBtn" class="primary">是（真实单词）</button><button id="noBtn" class="ghost">否</button></div>
    <div class="ir-progress"><div class="ir-track"><div class="ir-bar" id="rsBar" style="width:0%"></div></div><span id="rsProg">1 / ${q.words.length}</span></div>
    <div class="captured" id="rsFb"></div>
  </div>`;
  showRSWord(q);
  qArea.querySelector('#yesBtn').onclick=()=>rsAnswer(q,true);
  qArea.querySelector('#noBtn').onclick=()=>rsAnswer(q,false);
}
function showRSWord(q){
  document.getElementById('rsWord').textContent=q.words[rsState.idx].w;
  document.getElementById('rsProg').textContent=(rsState.idx+1)+' / '+q.words.length;
  document.getElementById('rsBar').style.width=(rsState.idx/q.words.length*100)+'%';
  document.getElementById('rsFb').textContent='';
  startTimer(5,()=>rsAnswer(q,null));
}
function rsAnswer(q,val){
  clearTimer();
  rsState.ans.push({w:q.words[rsState.idx].w,real:q.words[rsState.idx].real,val});
  rsState.idx++;
  if(rsState.idx>=q.words.length){rsFinish(q);return;}
  showRSWord(q);
}
function rsFinish(q){
  clearTimer();
  const correct=rsState.ans.filter(a=>a.val===a.real).length;
  const score=Math.round(correct/q.words.length*100);
  if(document.body.classList.contains('testing')){testNext();return;}
  const wrong=rsState.ans.filter(a=>a.val!==a.real).map(a=>a.w);
  const note=`正确 ${correct}/${q.words.length}（${score}%）`+(wrong.length?` · 答错：${wrong.join('、')}`:'');
  showResult('词汇判断',detFromScore(score),note);logHistory('rs',detFromScore(score),note);
}

// ================= 完形打字 FIB（Read & Complete）=================
function fibShow(word){const L=word.length;return L<=3?1:(L<=6?2:3);}
function fibSeg(seg){
  if(seg.gap){const w=seg.gap.word,n=fibShow(w);return `<span class="fib" data-word="${esc(w)}">${esc(w.slice(0,n))}<input class="fib-input" data-word="${esc(w)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${esc(w)}"></span>`;}
  return esc(seg.text);
}
function renderFIB(q){
  const body=q.segments.map(fibSeg).join('');
  qArea.innerHTML=`<div class="card">${cardHead(TC.fib.label,TC.fib.sub,q.time||TC.fib.time)}
    <p class="q-instr">补全每个单词缺失的部分（首字母已给出）。限时 3 分钟。</p>
    <div class="passage">${body}</div>
    <div class="q-actions">${aiBtn()}<button id="startBtn" class="primary">开始</button><button id="submitBtn" disabled>提交</button></div>
  </div>`;
  qArea.querySelector('#startBtn').onclick=()=>{qArea.querySelector('#startBtn').disabled=true;qArea.querySelector('#submitBtn').disabled=false;startTimer(q.time||TC.fib.time,()=>submitFIB(q));};
  qArea.querySelector('#submitBtn').onclick=()=>submitFIB(q);
}
function checkFib(el,qArea){
  const word=el.dataset.word;
  const input=el.querySelector('input').value.trim().toLowerCase();
  const ok=input===word.toLowerCase();
  if(ok)input.className?null:el.querySelector('input').classList.add('ok');
  else el.querySelector('input').classList.add('bad');
  return ok;
}
function submitFIB(q){
  clearTimer();
  const els=[...qArea.querySelectorAll('.fib')];
  let correct=0;const wrong=[];
  els.forEach(el=>{
    const word=el.dataset.word;
    const input=el.querySelector('input').value.trim().toLowerCase();
    if(input===word.toLowerCase()){correct++;el.querySelector('input').classList.add('ok');}
    else{wrong.push(word);el.querySelector('input').classList.add('bad');}
  });
  const score=Math.round(correct/els.length*100);
  const note=`正确 ${correct}/${els.length}（${score}%）`+(wrong.length?` · 答错：${wrong.join('、')}`:'');
  showResult('完形打字',detFromScore(score),note);logHistory('fib',detFromScore(score),note);
}

// ================= 选词填空 FIBW（Fill in the Blanks）=================
function renderFIBW(q){
  fibwState.idx=0;fibwState.ans=[];
  qArea.innerHTML=`<div class="card">${cardHead(TC.fibw.label,TC.fibw.sub,20)}
    <p class="q-instr">补全句子中不完整的单词（首字母已给出）。每句限时 20 秒，输完按回车或点「下一句」。</p>
    <div class="passage" id="fibwPassage"></div>
    <div class="q-actions">${aiBtn()}<button id="fibwNext" class="primary">下一句 →</button></div>
    <div class="ir-progress"><div class="ir-track"><div class="ir-bar" id="fibwBar" style="width:0%"></div></div><span id="fibwProg">1 / ${q.items.length}</span></div>
    <div class="captured" id="fibwFb"></div>
  </div>`;
  showFIBWItem(q);
  qArea.querySelector('#fibwNext').onclick=()=>fibwAnswer(q);
  const inp=qArea.querySelector('.fib input');
  if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter')fibwAnswer(q);});
}
function showFIBWItem(q){
  const it=q.items[fibwState.idx];
  document.getElementById('fibwPassage').innerHTML=it.segments.map(fibSeg).join('');
  document.getElementById('fibwProg').textContent=(fibwState.idx+1)+' / '+q.items.length;
  document.getElementById('fibwBar').style.width=(fibwState.idx/q.items.length*100)+'%';
  document.getElementById('fibwFb').textContent='';
  const inp=qArea.querySelector('.fib input');
  if(inp)inp.focus();
  startTimer(20,()=>fibwAnswer(q));
}
function fibwAnswer(q){
  clearTimer();
  const it=q.items[fibwState.idx];
  const gap=it.segments.find(s=>s.gap);
  const inp=qArea.querySelector('.fib input');
  const word=inp?inp.value.trim().toLowerCase():'';
  const ok=!!gap&&word===gap.gap.word.toLowerCase();
  fibwState.ans.push(ok);
  fibwState.idx++;
  if(fibwState.idx>=q.items.length){fibwFinish(q);return;}
  showFIBWItem(q);
}
function fibwFinish(q){
  clearTimer();
  const correct=fibwState.ans.filter(Boolean).length;
  const score=Math.round(correct/q.items.length*100);
  if(document.body.classList.contains('testing')){testNext();return;}
  const wrong=q.items.map((it,i)=>({it,i})).filter(x=>!fibwState.ans[x.i]).map(x=>x.it.segments.find(s=>s.gap).gap.word);
  const note=`正确 ${correct}/${q.items.length}（${score}%）`+(wrong.length?` · 答错：${wrong.join('、')}`:'');
  showResult('选词填空',detFromScore(score),note);logHistory('fibw',detFromScore(score),note);
}

// ================= 听写 LT =================
function renderLT(q){
  qArea.innerHTML=`<div class="card">${cardHead(TC.lt.label,TC.lt.sub,q.time||TC.lt.time)}
    <p class="q-instr">点「播放」听句子（最多 3 次），把听到的内容打进框里再提交。限时 1 分钟。</p>
    <div class="q-actions">${aiBtn()}<button id="playBtn" class="primary">🔊 播放</button><button id="submitBtn" disabled>提交</button></div>
    <textarea id="ltInput" placeholder="在这里输入你听到的英文…" style="margin-top:14px"></textarea>
  </div>`;
  let plays=0,started=false;
  qArea.querySelector('#playBtn').onclick=()=>{
    if(plays<3){speak(q.sentence);plays++;qArea.querySelector('#submitBtn').disabled=false;}
    if(!started){started=true;startTimer(q.time||TC.lt.time,()=>submitLT(q));}
  };
  qArea.querySelector('#submitBtn').onclick=()=>submitLT(q);
}
function submitLT(q){
  clearTimer();
  const input=qArea.querySelector('#ltInput').value.trim();
  if(!input){showResult('听写',0,'没有输入内容。原句：'+q.sentence);logHistory('lt',0,'空答');return;}
  const orig=normWords(q.sentence),typed=normWords(input);
  const matched=orig.filter(w=>typed.includes(w)).length;
  const score=Math.round(matched/orig.length*100);
  showResult('听写',detFromScore(score),`单词命中 ${matched}/${orig.length}（${score}%） · 原句：「${q.sentence}」`);
  logHistory('lt',detFromScore(score),`命中${matched}/${orig.length}`);
}

    <div class="q-actions">${aiBtn()}</div>
    <div id="irQuestion"></div>
  </div>`;
  irState.start=Date.now();
  showIRStep();
  startTimer(q.time,()=>irAutoSubmit());
}
function renderIRPassage(mode){
  const q=irState.q;
  const paras=q.paras.map((p,i)=>{
    let html=esc(p);
    if(mode==='q1'){
      q.q1.blanks.filter(b=>b.p===i).forEach(b=>{
        html=html.replace(esc(b.word),`<span class="ir-dropzone" data-expected="${esc(b.word)}">＋</span>`);
      });
    }else if(mode==='q2'&&q.q2.p===i){
      html=html.replace(esc(q.q2.sentence),`<span class="ir-dropzone ir-dz-s" data-expected="${esc(q.q2.options[q.q2.answer])}">＋</span>`);
    }
    if(mode==='hl'&&irState.sel){
      const s=esc(irState.sel);
      const si=html.indexOf(s);
      if(si>=0){html=html.slice(0,si)+'<mark>'+s+'</mark>'+html.slice(si+s.length);}
    }
    return `<p>${html}</p>`;
  });
  const pass=document.getElementById('irPassage');
  if(pass)pass.innerHTML=paras.join('');
}
function normT(t){return String(t||'').replace(/\s+/g,' ').trim().toLowerCase();}
function irFb(msg){
  const el=document.getElementById('irFb');
  if(el)el.textContent=msg;
}
function showIRStep(){
  const bar=document.getElementById('irBar');
  const prog=document.getElementById('irProg');
  if(!bar)return;
  prog.textContent=Math.min(irState.step+1,6)+' / 6';
  bar.style.width=(Math.min(irState.step,6)/6*100)+'%';
  if(irState.step>=6){showIRResult();return;}
  const q=irState.q,s=irState.step;
  const el=document.getElementById('irQuestion');
  if(s===0)return renderIRQ1(el);
  if(s===1)return renderIRQ2(el);
  if(s===2||s===3)return renderIRHL(el,s);
  if(s===4)return renderIRPick(el,'主旨 · Identify the Idea',q.q5.question,q.q5.options,q.q5.answer);
  if(s===5)return renderIRPick(el,'标题 · Title the Passage','为这篇文章选择一个最合适的标题。',q.q6.options,q.q6.answer);
}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function renderIRQ1(el){
  const q=irState.q;
  renderIRPassage('q1');
  const pool=q.q1.pool&&q.q1.pool.length?q.q1.pool:q.q1.blanks.map(b=>b.options[b.answer]);

function irWireDnD(){
  let sel=null;
  const chips=[...document.querySelectorAll('.ir-chip')];
  const zones=[...document.querySelectorAll('.ir-dropzone')];
  if(!zones.length)return;
  const step=irState.step; // 0=Q1 1=Q2
  const place=(chip,zone)=>{
    if(zone.dataset.filled||chip.classList.contains('used'))return;
    const v=chip.dataset.val;
    if(zone.dataset.expected===v){
      zone.textContent=(step===1)?'✓ 已填入':v;
      zone.classList.add('filled','ok');zone.dataset.filled=v;
      chip.classList.add('used');chip.disabled=true;
      if([...document.querySelectorAll('.ir-dropzone')].every(z=>z.dataset.filled))finishStep();
    }else{
      zone.classList.add('bad');setTimeout(()=>zone.classList.remove('bad'),500);
    }
  };
  const finishStep=()=>{
    const z=[...document.querySelectorAll('.ir-dropzone')];
    const allGood=z.every(x=>x.dataset.filled===x.dataset.expected);
    irState.points+=allGood?1:0;irState.answers.push(allGood);
    irFb('第 '+(step+1)+' 题 '+(allGood?'正确 ✓':'有空格填错 ✗'));
    setTimeout(()=>{irState.step++;showIRStep();},1400);
  };
  chips.forEach(chip=>{
    chip.onclick=()=>{if(chip.classList.contains('used'))return;chips.forEach(c=>c.classList.remove('sel'));chip.classList.add('sel');sel=chip;};
    chip.ondragstart=(e)=>{sel=chip;e.dataTransfer.setData('text/plain',chip.dataset.val);};
  });
  zones.forEach(zone=>{
    zone.onclick=()=>{if(sel&&!sel.classList.contains('used'))place(sel,zone);};
    zone.ondragover=(e)=>{e.preventDefault();};
    zone.ondrop=(e)=>{e.preventDefault();const v=e.dataTransfer.getData('text/plain');const chip=chips.find(c=>c.dataset.val===v&&!c.classList.contains('used'));if(chip)place(chip,zone);};
  });
}

async function submitIL(q){
  clearTimer();
  let correct=0;const wrong=[];
  q.turns.forEach((t,i)=>{
    const c=ilState.choices[i];
    if(c===t.answer)correct++;
    else wrong.push(`回合${i+1} 应为：${t.options[t.answer]}`);
  });
  const mcScore=Math.round(correct/q.turns.length*100);
  const summary=(((qArea.querySelector('#ilSummary')||{}).value)||'').trim();
  let html=`<div class="result"><h3>互动听力</h3><div class="score-line"><span class="big-score">回应题 ${correct}/${q.turns.length}</span><span>（${mcScore}%）</span></div>`;
  html+=`<div class="comment">${wrong.length?('<p>'+esc('错题：'+wrong.join('；'))+'</p>'):'<p>回应题全对。</p>'}</div>`;
  if(!summary){html+=`<p class="hint">总结未填写。</p></div>`;resultArea.innerHTML=html;logHistory('il',detFromScore(mcScore),'回应'+correct+'/'+q.turns.length+'，未写总结');return;}
  resultArea.innerHTML=html+`<p class="hint">总结批改中…</p></div>`;
  try{
    const sys=writingSys(['Production','Comprehension']);
    const user=`对话场景：${q.scenario}\n对话内容（含最佳回应）：\n${q.turns.map(t=>t.speaker+': '+t.line+'\nYou: '+t.options[t.answer]).join('\n')}\n\n学生的总结：\n${summary}`;
    const raw=await callDS([{role:'system',content:sys},{role:'user',content:user}],0.2);
    const r=parseJSON(raw);
    if(r){
      const cards=[['Literacy','literacy'],['Comprehension','comprehension'],['Conversation','conversation'],['Production','production']].map(([n,k])=>r[k]!=null?dimCard(n,round5(r[k])):'').join('');
      const tag=r.overall!=null?('DET '+round5(r.overall)+' · '+cefrOf(r.overall)):'格式异常';
      resultArea.innerHTML=html+`<p class="hint">总结批改（${tag}）：</p><div class="dims">${cards}</div><div class="comment"><p>${esc(r.comment||'')}</p>${r.priority?`<p class="priority">🎯 ${esc(r.priority)}</p>`:''}</div></div>`;
    }
    else{resultArea.innerHTML=html+`<p class="hint">总结批改格式异常。</p></div>`;}
  }catch(err){resultArea.innerHTML=html+`<p class="hint err">总结批改失败：${esc(err.message)}</p></div>`;}
  logHistory('il',detFromScore(mcScore),`回应${correct}/${q.turns.length}`);
}

// ================= 批改（对齐 DET 官方评分标准）=================
const DET_CTX='DET 官方评分框架：总分 10–160（5 分一档）；CEFR 分档 10–55=A1/A2、60–85=B1、90–115=B2、120–160=C1/C2；四个官方子分 Literacy(读写)/Comprehension(理解)/Conversation(会话)/Production(产出)。';
// 官方 concordance（2024–2025 数据）：DET ↔ IELTS Academic
const IELTS_CONC=[[10,1.5],[15,2],[20,2.5],[30,3],[45,3.5],[55,4],[65,4.5],[75,5],[85,5.5],[95,6],[105,6.5],[115,7],[125,7.5],[135,8],[145,8.5],[155,9]];
// 官方 concordance：DET ↔ TOEFL iBT（0–120 旧制，取区间下限）
const TOEFL_CONC=[[10,0],[30,1],[35,3],[40,6],[45,11],[50,16],[55,22],[60,28],[65,34],[70,40],[75,46],[80,52],[85,58],[90,64],[95,70],[100,76],[105,82],[110,88],[115,94],[120,99],[125,105],[130,110],[135,114],[140,117],[145,119],[150,120]];
function round5(n){return n==null?null:Math.round(n/5)*5;}
function cefrOf(d){if(d==null)return '—';if(d<=55)return 'A1/A2';if(d<=85)return 'B1';if(d<=115)return 'B2';return 'C1/C2';}
function ieltsOf(d){let r='—';for(const[k,v]of IELTS_CONC){if(d>=k)r=v;else break;}return r;}
function toeflOf(d){let r='—';for(const[k,v]of TOEFL_CONC){if(d>=k)r=v;else break;}return r;}
function goalWeak(){
  const p=[];
  if(settings.goal)p.push('学生目标分是'+settings.goal+'，请指出差距。');
  if(settings.weak)p.push('学生自述弱项：'+settings.weak+'，请重点批改这一块。');
  return p.join(' ');
}
function subInstr(subs){return '本题影响的官方子分：'+subs.join('、')+'（其余子分填 null）。';}
function writingSys(subs){return '你是 Duolingo English Test (DET) 资深考官。'+DET_CTX+'严格按官方能力描述批改写作。只输出一个 JSON 对象，不要任何其他文字：{"overall":10-160(5的倍数),"literacy":0-160或null,"comprehension":0-160或null,"conversation":0-160或null,"production":0-160或null,"cefr":"A1/A2或B1或B2或C1/C2","comment":"中文2-3句，指出具体问题和改进","priority":"中文一句话，当前最该练的一点"}。评分严格，不虚高。'+subInstr(subs)+goalWeak();}
function speakSys(subs){return '你是 DET 口语考官（Conversation/Production）。'+DET_CTX+'按官方能力描述批改学生口语转写，注明发音需自查。只输出一个 JSON 对象，不要任何其他文字：{"overall":10-160(5的倍数),"literacy":0-160或null,"comprehension":0-160或null,"conversation":0-160或null,"production":0-160或null,"cefr":"A1/A2或B1或B2或C1/C2","comment":"中文2-3句","priority":"中文一句话，当前最该练的一点"}。评分严格，不虚高。'+subInstr(subs)+goalWeak();}
async function gradeWriting(label,instr,answer,key){
  submitBtnBusy(true);
  try{
    const raw=await callDS([{role:'system',content:writingSys(['Literacy','Production'])},{role:'user',content:'题目与要求：'+instr+'\n\n学生的回答：\n'+answer}],0.2);
    const r=parseJSON(raw);

const AI_PROMPTS={
  rs:'生成一道 DET 词汇判断题。只输出 JSON，不要其他文字：{"words":[{"w":"单词","real":true}]}。共 9 个词，约一半真实常用词、一半看似合理的编造词。',
  fib:'生成一道 DET 完形打字题（Read & Complete）。只输出 JSON：{"segments":[{"text":"前面文字"},{"gap":{"word":"完整单词"}},{"text":"后面文字"}]}。共 3 个空，中间难度的自然英文短文，单词 4–12 个字母。',
  fibw:'生成一道 DET 选词填空（Fill in the Blanks）练习。只输出 JSON：{"items":[{"segments":[{"text":"句首"},{"gap":{"word":"完整单词"}},{"text":"句尾"}]}]}。共 3 个独立英文句子，每句缺一个单词。',
  lt:'生成一句 5–12 词的英文句子用于听写。只输出 JSON：{"sentence":"..."}',
  ir:'生成一道 DET 互动阅读题：一篇英文短文（8–10 句）+ 6 道题。只输出 JSON：{"passage":"短文","questions":[{"type":"csentence|completepassage|highlight|ideatopic|title","qt":"Complete the Sentences|Complete the Passage|Highlight the Answer|Identify the Idea|Title the Passage","q":"题目","options":["A","B","C","D"],"answer":0}]}。组合建议：2 道 Complete the Sentences、1 道 Complete the Passage、2 道 Highlight、1 道 Identify the Idea、1 道 Title；answer 为正确选项下标；中间难度。',
  il:'生成一道 DET 互动听力（Listen and Respond）题：一段学生与教授/同学的场景对话。只输出 JSON：{"scenario":"英文场景描述（你是学生，想找对方办什么事）","turns":[{"speaker":"Professor","line":"对方说的一句台词","options":["回应A","回应B","回应C","回应D"],"answer":0}]}。要求：scenario 用英文写清场景；5 个回合，每回合 4 个回应选项；answer 为最佳回应下标(0-based)；对话连贯自然、难度中等。',
  sp:'用中文描述一张照片场景，用于看图说话。只输出 JSON：{"scene":"中文场景描述，30-50字"}',
  rtsp:'生成一道 DET 读后口说（Read, Then Speak）英文题目（考生读完开口回答）。只输出 JSON：{"topic":"英文题目"}',
  isp:'生成一道 DET 互动口说（Interactive Speaking）的第一个问题（AI 角色 Bea 的开场白，英文，一句话，适合轻松开场）。只输出 JSON：{"opener":"英文第一问"}',
  ss:'生成一道 DET 口说样题（Speaking Sample）英文题目。只输出 JSON：{"topic":"英文题目"}',
  wp:'用中文描述一张照片场景，用于看图写作。只输出 JSON：{"scene":"中文场景描述，30-50字"}',
  iw:'生成一段 DET 互动写作 Part 1 的英文阅读材料（80–120 词，末尾自然引出写作任务）。只输出 JSON：{"prompt":"英文阅读段落"}',
  ws:'生成一道 DET 写作样题（Writing Sample）英文题目。只输出 JSON：{"topic":"英文题目"}'
};
function validateAI(type,q){
  const t=TC[type].time;
  if(type==='rs')return Array.isArray(q.words)&&q.words.length===9&&q.words.every(w=>typeof w.w==='string'&&typeof w.real==='boolean')?Object.assign({time:t},q):null;
  if(type==='fib')return Array.isArray(q.segments)&&q.segments.filter(s=>s.gap).length>=2&&q.segments.every(s=>!s.gap||typeof s.gap.word==='string')?Object.assign({time:t},q):null;
  if(type==='fibw')return Array.isArray(q.items)&&q.items.length>=2&&q.items.every(it=>Array.isArray(it.segments)&&it.segments.filter(s=>s.gap).length>=1)?Object.assign({time:t},q):null;
  if(type==='lt')return typeof q.sentence==='string'&&q.sentence?Object.assign({time:t},q):null;
  if(type==='ir')return Array.isArray(q.paras)&&q.paras.length>=2&&q.q1&&Array.isArray(q.q1.blanks)&&q.q1.blanks.length>=3&&q.q2&&Array.isArray(q.q2.options)&&q.q2.options.length>=3&&q.q3&&q.q4&&q.q5&&Array.isArray(q.q5.options)&&q.q6&&Array.isArray(q.q6.options)?Object.assign({time:t},q):null;
  if(type==='il')return typeof q.scenario==='string'&&q.scenario&&Array.isArray(q.turns)&&q.turns.length>=3&&q.turns.every(x=>typeof x.line==='string'&&Array.isArray(x.options)&&x.options.length>=3&&typeof x.answer==='number')?Object.assign({time:t,summary_time:75,scenario:q.scenario,turns:q.turns},q):null;
  if(type==='sp'||type==='wp')return typeof q.scene==='string'&&q.scene?Object.assign({time:t},q):null;
  if(type==='rtsp'||type==='ss'||type==='ws')return typeof q.topic==='string'&&q.topic?Object.assign({time:t},q):null;
  if(type==='isp')return typeof q.opener==='string'&&q.opener?Object.assign({time:t,opener:q.opener,target:6,fallback:[]},q):null;
  if(type==='iw')return typeof q.prompt==='string'&&q.prompt?Object.assign({time:t},q):null;
  return null;
}
async function aiGenerate(type){
  if(type==='sp'||type==='wp'){ // 看图题本地照片有限，直接随机抽一张（不调 AI）
    let bank=photoBankFiltered();
    if(!bank.length)bank=BANK[type];
    return Object.assign({time:TC[type].time}, rnd(bank));
  }
  if(type==='ir'){ // 互动阅读本地文章有限，直接随机抽一篇（AI 难稳定生成带答案的完整 6 题结构）
    return Object.assign({time:TC.ir.time}, rnd(BANK.ir));
  }
  const raw=await callDS([{role:'system',content:'You generate practice questions for the Duolingo English Test. Always return ONLY a valid JSON object, no markdown, no other text.'},{role:'user',content:AI_PROMPTS[type]}],0.6);
  const v=validateAI(type,parseJSON(raw));
  if(!v)throw new Error('AI 返回内容不合规，已保留原题');
  return v;
}
async function doAIQuestion(){
  if(!currentType)return;
  const btn=document.getElementById('aiBtn');
  if(btn){btn.disabled=true;btn.textContent='生成中…';}
  clearTimer();
  try{const q=await aiGenerate(currentType);currentQ=q;renderCurrent(currentType,q);}
  catch(err){
    if(btn){btn.disabled=false;btn.textContent='🔄 AI 出题';}
    resultArea.innerHTML='<div class="result"><p class="err">'+esc(err.message)+'</p></div>';
    if(currentQ)RENDERERS[currentType](currentQ);
  }
}

async function callDS(messages,temperature){
  if(!settings.apiKey)throw new Error('请先在 ⚙ 设置 里填 API Key');
  const res=await fetch(settings.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+settings.apiKey},body:JSON.stringify({model:settings.model,messages,temperature,max_tokens:1100})});
  if(!res.ok){const t=await res.text().catch(()=>'');throw new Error('API '+res.status+' '+t.slice(0,200));}
  const data=await res.json();
  return data.choices[0].message.content;
}
function parseJSON(raw){
  const c=String(raw).trim().replace(/^```(?:json)?/,'').replace(/```$/,'').trim();
  try{return JSON.parse(c);}catch(e){}
  const m=c.match(/\{[\s\S]*\}/);
  if(m){try{return JSON.parse(m[0]);}catch(e){}}
  return null;
}

const RENDERERS={rs:renderRS,fib:renderFIB,fibw:renderFIBW,lt:renderLT,ir:renderIR,il:renderIL,sp:renderSP,rtsp:renderRTSP,isp:renderISP,ss:renderSS,wp:renderWP,iw:renderIW,ws:renderWS};
function dimCard(name,val){return '<div class="dim"><b>'+(val===undefined?'–':val)+'</b><span>'+name+'</span></div>';}
function showResult(label,score,note,dims){
  let html='<div class="result"><h3>'+esc(label)+'</h3>';
  const s=score!=null?round5(score):(dims&&dims.overall!=null?round5(dims.overall):null);
  if(s!=null){
    html+='<div class="score-line"><span class="big-score">'+s+'</span><span>DET 估算 · CEFR '+cefrOf(s)+'</span></div>';
    html+='<div class="hint" style="margin:-4px 0 10px">≈ 雅思 '+ieltsOf(s)+' · TOEFL '+toeflOf(s)+'（官方 concordance）</div>';
  }
  if(dims){
    const subs=[['Literacy 读写','literacy'],['Comprehension 理解','comprehension'],['Conversation 会话','conversation'],['Production 产出','production']];
    const cards=subs.map(([n,k])=>dims[k]!=null?dimCard(n,round5(dims[k])):'').join('');
    if(cards)html+='<div class="dims">'+cards+'</div>';
  }
  html+='<div class="comment">';
  if(dims&&dims.comment)html+='<p>'+esc(dims.comment)+'</p>';
  if(dims&&dims.priority)html+='<p class="priority">🎯 '+esc(dims.priority)+'</p>';
  if(note)html+='<p style="color:var(--muted);font-size:13px;margin-top:6px">'+esc(note).replace(/\n/g,'<br>')+'</p>';
  html+='</div><div class="q-actions" style="margin-top:12px"><button onclick="showType(currentType)">下一题</button></div></div>';
  resultArea.innerHTML=html;
}

  try{
    const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,messages:[{role:'user',content:'ping'}],max_tokens:5})});
    if(!res.ok){const t=await res.text().catch(()=>'');el.textContent='失败：'+res.status+' '+t.slice(0,150);el.className='hint err';return;}
    el.textContent='✅ 连接成功。';el.className='hint ok';
  }catch(err){el.textContent='失败：'+err.message+'（若报 CORS，需要用本地代理，回聊天找我）';el.className='hint err';}
};
document.getElementById('btnHistory').onclick=()=>{renderHistory();openModal('historyModal');};
document.getElementById('closeHistory').onclick=()=>closeModal('historyModal');

// ================= 模拟考试 =================
const SUBMAP={
  rs:['Literacy','Comprehension'],fib:['Literacy','Comprehension'],fibw:['Literacy','Comprehension'],
  lt:['Comprehension','Conversation'],ir:['Literacy','Comprehension'],
  il:['Comprehension','Conversation','Production'],
  sp:['Conversation','Production'],rtsp:['Conversation','Production'],isp:['Conversation','Production'],ss:['Conversation','Production'],
  wp:['Literacy','Production'],iw:['Literacy','Production'],ws:['Literacy','Production']
};
const SUBJ_INSTR={
  wp:q=>`照片内容：${q.scene}${q.band?'（本题目标分数段 DET '+bandLabel(q.band)+'）':''}\n要求：用 1–2 句英文描述这张照片。`,
  ws:q=>`题目：${q.topic}\n要求：写作样题，写一篇完整短文（建议 3 分钟以上、2 段以上）。`,
  iw:(q,a,f)=>`阅读材料：${q.prompt}\nPart 2 追问：${f}\n要求：Part 1 与 Part 2 两段完整回应。\nPart 1：${a||'（空）'}`,
  sp:q=>`照片内容：${q.scene}${q.band?'（本题目标分数段 DET '+bandLabel(q.band)+'）':''}\n要求：用 1–2 句英文口头描述这张照片。`,
  rtsp:q=>`题目：${q.topic}\n要求：读题后口头回答。`,
  ss:q=>`题目：${q.topic}\n要求：连续用英文说 1–3 分钟，完整表达观点和理由。`,
  isp:q=>`互动口说：Bea 开场问题 ${q.opener||''}（后续问题由 AI 根据回答生成）。`,
  ilsum:q=>`对话场景：${q.scenario}\n对话内容（含最佳回应）：\n${q.turns.map(t=>t.speaker+': '+t.line+'\nYou: '+t.options[t.answer]).join('\n')}\n要求：用 75 秒写一段完整的英文段落总结这段对话（不要只列要点，写完整段落）。`
};
let testRunning=false,testSteps=[],testStepIdx=0,testResults=[],testIwState={};
function setTestPhase(t){const el=document.getElementById('testPhase');if(el)el.textContent=t;}

async function buildTestSteps(){
  const spec=['rs','lt','fib','fibw','rs','lt','wp','sp','ir','lt','rs','rtsp','iw','iw','fibw','il','ws','isp','ss'];
  const steps=[];let iwSeen=0;
  for(let i=0;i<spec.length;i++){
    const type=spec[i];let q=null;
    if(settings.apiKey){try{q=await aiGenerate(type);}catch(e){}}
    if(!q)q=nextQuestion(type);
    let part=1;if(type==='iw'){iwSeen++;part=iwSeen;}
    steps.push({type,q,part});
    setTestPhase('生成试卷 '+(i+1)+'/'+spec.length+' …');
  }
  return steps;
}
function setupTestMode(step){
  qArea.classList.add('test-mode');
  const type=step.type;
  if(type==='iw'&&step.part===2){
    const sb=qArea.querySelector('#submitB');
    if(sb){sb.textContent='下一题 →';sb.disabled=false;sb.className='primary';sb.onclick=()=>testNext();}
    const st=qArea.querySelector('#startB');
    if(st){st.onclick=()=>{st.disabled=true;const s=qArea.querySelector('#submitB');if(s)s.disabled=false;startTimer(180,()=>testNext());};st.click();}
    return;
  }
  const sb=qArea.querySelector('#submitBtn');
  if(sb){sb.textContent='下一题 →';sb.disabled=false;sb.className='primary';sb.onclick=()=>testNext();}
  if(type==='lt'){
    const pb=qArea.querySelector('#playBtn');
    if(pb){pb.onclick=()=>{speak(step.q.sentence);const s=qArea.querySelector('#submitBtn');if(s)s.disabled=false;startTimer(TC.lt.time,()=>testNext());};pb.click();}
    return;
  }
  if(type==='il'){
    const st=qArea.querySelector('#startBtn');
    if(st)st.click();
    return;
  }
  const startBtn=qArea.querySelector('#startBtn');
  if(startBtn){
    startBtn.onclick=()=>{
      startBtn.disabled=true;
      const s=qArea.querySelector('#submitBtn');if(s)s.disabled=false;
      if(type==='ws'){
        startTimer(30,()=>{const s2=qArea.querySelector('#submitBtn');if(s2)s2.disabled=false;startTimer(TC.ws.time,()=>testNext());});
      }else{
        startTimer(type==='iw'?TC.iw.time/2:TC[type].time,()=>testNext());
      }
    };
    startBtn.click();
  }
}
function renderTestStep(idx){
  const step=testSteps[idx];
  currentType=step.type;currentQ=step.q;
  setActiveTab(step.type);
  if(step.type==='iw'&&step.part===2){renderIWB(step.q,testIwState.partA,testIwState.follow);}
  else{RENDERERS[step.type](step.q);}
  setupTestMode(step);
  setTestPhase('第 '+(idx+1)+' / '+testSteps.length+' 题');
}
function collect(type,q){
  if(type==='rs'){const c=rsState.ans.filter(a=>a.val===a.real).length;return {score:rsState.ans.length?Math.round(c/rsState.ans.length*100):0};}
  if(type==='fib'){
    const els=[...qArea.querySelectorAll('.fib')];
    let correct=0;els.forEach(el=>{if(el.querySelector('input').value.trim().toLowerCase()===el.dataset.word.toLowerCase())correct++;});
    return {score:els.length?Math.round(correct/els.length*100):0};
  }
  if(type==='fibw'){const c=fibwState.ans.filter(Boolean).length;return {score:fibwState.ans.length?Math.round(c/fibwState.ans.length*100):0};}
  if(type==='lt'){
    const input=(((qArea.querySelector('#ltInput')||{}).value)||'').trim();
    const orig=normWords(q.sentence),typed=normWords(input);
    const matched=orig.filter(w=>typed.includes(w)).length;
    return {score:orig.length?Math.round(matched/orig.length*100):0};
  }
  if(type==='ir')return {score:irState.q?Math.round(irState.points/6*100):0};
  if(type==='il'){
    let correct=0;q.turns.forEach((t,i)=>{if(ilState.choices[i]===t.answer)correct++;});
    const summary=(((qArea.querySelector('#ilSummary')||{}).value)||'').trim();
    return {mcScore:q.turns.length?Math.round(correct/q.turns.length*100):0,summary,mcCorrect:correct,mcTotal:q.turns.length};
  }
  if(type==='wp')return {text:(((qArea.querySelector('#wpInput')||{}).value)||'').trim()};
  if(type==='ws')return {text:(((qArea.querySelector('#wsInput')||{}).value)||'').trim()};
  if(type==='iw')return {text:((((qArea.querySelector('#iwA')||{}).value)||((qArea.querySelector('#iwB')||{}).value)||'')).trim()};
  if(type==='sp'||type==='rtsp'||type==='ss')return {text:(((qArea.querySelector('#speakText')||{}).value)||'').trim()};
  if(type==='isp'){const list=ispState.list.length?ispState.list:(q.opener?[q.opener]:[]);return {answers:list.map((_,i)=>ispAnswers[i]||''),answered:list.filter((_,i)=>ispAnswers[i]).length,questions:list.slice()};}
  return {score:0};
}
async function testNext(){
  clearTimer();stopRecord();
  const step=testSteps[testStepIdx];
  const r=collect(step.type,step.q);
  testResults[testStepIdx]=r;
  if(step.type==='iw'&&step.part===1){
    testIwState.partA=r.text;
    setTestPhase('生成 Part 2…');
    let follow='Please explain the main point of your response in more detail and give a specific example.';
    if(settings.apiKey){try{const raw=await callDS([{role:'system',content:'你是 DET 考官。根据学生 Part 1 写作内容生成一个自然衔接的 Part 2 追问问题（英文一句话，只输出问题本身）。'},{role:'user',content:'阅读材料：'+step.q.prompt+'\nPart 1：'+r.text}],0.5);if(raw&&raw.trim())follow=raw.trim().replace(/^["']|["']$/g,'');}catch(e){}}
    testIwState.follow=follow;
  }
  testStepIdx++;
  if(testStepIdx<testSteps.length)renderTestStep(testStepIdx);
  else testFinish();
}
async function gradeOne(s){
  const isWriting=(s.type==='wp'||s.type==='ws'||s.type==='iw'||s.type==='ilsum');
  const sys=isWriting?writingSys(['Literacy','Production']):speakSys(['Conversation','Production']);
  const raw=await callDS([{role:'system',content:sys},{role:'user',content:'题目与要求：'+s.instr+'\n\n学生的回答：\n'+s.text}],0.2);
  return parseJSON(raw)||{overall:null};
}
async function testFinish(){
  const subj=[];
  testResults.forEach((r,i)=>{
    if(!r)return;const type=testSteps[i].type;const q=testSteps[i].q;
    if(type==='wp')subj.push({type,i,text:r.text,instr:SUBJ_INSTR.wp(q)});
    else if(type==='ws')subj.push({type,i,text:r.text,instr:SUBJ_INSTR.ws(q)});
    else if(type==='iw'&&testSteps[i].part===2)subj.push({type,i,text:r.text,instr:SUBJ_INSTR.iw(q,testIwState.partA,testIwState.follow)});
    else if(type==='sp')subj.push({type,i,text:r.text,instr:SUBJ_INSTR.sp(q)});
    else if(type==='rtsp')subj.push({type,i,text:r.text,instr:SUBJ_INSTR.rtsp(q)});
    else if(type==='ss')subj.push({type,i,text:r.text,instr:SUBJ_INSTR.ss(q)});
    else if(type==='isp')subj.push({type,i,text:r.answers.join(' '),instr:(r.questions&&r.questions.length)?('互动口说问题：\n'+r.questions.map((x,i2)=>'Q'+(i2+1)+': '+x).join('\n')):SUBJ_INSTR.isp(q)});
    else if(type==='il'&&r.summary)subj.push({type:'ilsum',i,text:r.summary,instr:SUBJ_INSTR.ilsum(q)});
  });
  const grades={};
  for(let k=0;k<subj.length;k++){
    setTestPhase('批改主观题 '+(k+1)+'/'+subj.length+'…');
    try{grades[subj[k].i]=await gradeOne(subj[k]);}catch(e){grades[subj[k].i]={overall:null,comment:'批改失败'};}
  }
  renderTestReport(grades);
}
function detFromScore(pct){return round5(Math.round(10+pct/100*150));}
function renderTestReport(grades){
  document.body.classList.remove('testing');
  document.getElementById('testBar').classList.add('hidden');
  qArea.classList.remove('test-mode');
  const subsum={Literacy:[],Comprehension:[],Conversation:[],Production:[]};
  const rows=[];let tot=0,cnt=0;
  testSteps.forEach((step,i)=>{
    const r=testResults[i];if(!r)return;
    if(step.type==='iw'&&step.part===1)return;
    let det=null,note='';
    const g=grades[i];
    if(step.type==='il'){
      const mcDet=detFromScore(r.mcScore);
      det=(g&&g.overall!=null)?Math.round((mcDet+g.overall)/2):mcDet;
      note=(r.summary?'· 总结已批改':'· 未写总结')+(g&&g.comment?' · '+g.comment:'');
    }else if(g&&g.overall!=null){det=g.overall;note=g.comment||'';}
    else if(r.score!=null){det=detFromScore(r.score);note=(step.type==='lt')?('命中 '+r.score+'%'):(r.score+'%');}
    else return;
    det=round5(det);
    tot+=det;cnt++;
    (SUBMAP[step.type]||[]).forEach(s=>subsum[s].push(det));
    rows.push({label:TC[step.type].label+(step.type==='iw'?' (Part 2)':''),det,note});
  });
  const overall=cnt?round5(Math.round(tot/cnt)):null;
  const subs={};for(const k in subsum){const a=subsum[k];subs[k]=a.length?round5(Math.round(a.reduce((x,y)=>x+y,0)/a.length)):null;}
  let html='<div class="result"><h3>🧪 模拟考试报告</h3>';
  if(overall!=null){
    html+='<div class="score-line"><span class="big-score">'+overall+'</span><span>DET 估算 · CEFR '+cefrOf(overall)+'</span></div>';
    html+='<div class="hint" style="margin:-4px 0 10px">≈ 雅思 '+ieltsOf(overall)+' · TOEFL '+toeflOf(overall)+'（官方 concordance，仅供参考）</div>';
  }
  html+='<div class="dims">'
    +dimCard('Literacy 读写',subs.Literacy)+dimCard('Comprehension 理解',subs.Comprehension)
    +dimCard('Conversation 会话',subs.Conversation)+dimCard('Production 产出',subs.Production)
    +'</div>';
  html+='<table class="report-table"><thead><tr><th>题型</th><th style="text-align:right">得分</th><th>备注</th></tr></thead><tbody>';
  rows.forEach(row=>{
    html+='<tr><td>'+esc(row.label)+'</td><td class="c">'+(row.det!=null?row.det:'–')+'</td><td class="hint">'+esc(row.note||'')+'</td></tr>';
  });
  html+='</tbody></table>';
  html+='<div class="comment"><p>说明：总分按各题型得分平均估算，仅供参考；真实 DET 总分由官方自适应算法给出。互动阅读/互动听力在整场考试中每次出 12 题左右，本模拟用一组代表题型。</p></div>';
  html+='<div class="q-actions"><button onclick="afterTest()">返回练习</button></div></div>';
  resultArea.innerHTML=html;
  logHistory('test',overall!=null?overall:0,'模拟考试 '+testSteps.length+' 题');
}
function afterTest(){testRunning=false;showType('rs');}
async function startTest(){
  if(testRunning)return;
  if(!confirm('开始模拟考试？\n\n按真实 DET 流程连续作答：每题限时与真实考试一致（界面不显示倒计时），时间到自动进入下一题；中途不能暂停。时长约 45–60 分钟。'))return;
  testRunning=true;
  document.body.classList.add('testing');
  document.getElementById('testBar').classList.remove('hidden');
  testResults=[];testIwState={};
  for(const k in ispAnswers)delete ispAnswers[k];
  qArea.innerHTML='<div class="card"><p class="q-instr">正在生成试卷…（若已填 API Key 会现场生成题目，约 10–20 秒）</p></div>';
  setTestPhase('准备中…');
  testSteps=await buildTestSteps();
  testStepIdx=0;
  renderTestStep(0);
}
document.getElementById('btnQuitTest').onclick=()=>{
  if(confirm('退出考试？本次成绩不计入记录。')){clearTimer();stopRecord();testRunning=false;document.body.classList.remove('testing');document.getElementById('testBar').classList.add('hidden');qArea.classList.remove('test-mode');showType('rs');}
};

// ================= 初始化 =================
TABORDER.forEach(k=>{
  const b=document.createElement('button');
  b.textContent=TC[k].label;b.dataset.key=k;b.onclick=()=>showType(k);
  typeTabs.appendChild(b);
});
document.getElementById('btnRandom').onclick=()=>showType(rnd(TABORDER));
document.getElementById('btnTest').onclick=()=>{startTest();};
document.getElementById('bandSel').onchange=()=>{
  bandFilter=document.getElementById('bandSel').value;
  if(currentType==='wp'||currentType==='sp')showType(currentType);
};
if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}
showType('rs');
</script>
